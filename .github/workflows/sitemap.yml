name: Generate sitemap

# Rebuilds sitemap.xml whenever an HTML page is added, changed, or removed on
# main, then commits the result back. The path filter means the sitemap commit
# itself never re-triggers this workflow (no loop). Manual runs are available
# from the Actions tab via "Run workflow".

on:
  push:
    branches: [main]
    paths:
      - "**.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so <lastmod> reflects real commit dates

      - name: Generate sitemap.xml
        run: python3 .github/scripts/generate-sitemap.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: update sitemap.xml"
            git push
          else
            echo "sitemap.xml is already up to date."
          fi
